packages:
  - apps/*
  - packages/*
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  "@biomejs/biome": true
supportedArchitectures:
  os: [current]
  cpu: [current]
  libc: [current]
minimumReleaseAgeExclude:
  - "@expo/metro-runtime@58.0.16"
patchedDependencies:
  react-native-android-widget: patches/react-native-android-widget.patch
