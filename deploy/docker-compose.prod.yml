# 生产部署。用法见 docs/DEPLOYMENT.md：
#   cp deploy/.env.example deploy/.env   # 填好配置
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d
name: xiaodouya
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: xiaodouya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: xiaodouya
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaodouya"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    image: ${SERVER_IMAGE:-ghcr.io/gchust/xiaodouya-server:latest}
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://xiaodouya:${POSTGRES_PASSWORD}@postgres:5432/xiaodouya
      APP_SECRET: ${APP_SECRET:?请在 .env 里设置 APP_SECRET}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-4096}
      # 自建默认不限：存储是自己的。托管的默认值和依据见 docs/CAPACITY.md。
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-4096}
      FAMILY_QUOTA_MB: ${FAMILY_QUOTA_MB:-0}
      # Caddy 用 {remote_host} 覆盖了这个头，只有一段，是可信的。
      CLIENT_IP_HEADER: x-forwarded-for
      CLIENT_IP_POSITION: last
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      ALLOW_CUSTOM_STORAGE: ${ALLOW_CUSTOM_STORAGE:-true}
      ALLOW_PRIVATE_STORAGE_ENDPOINTS: ${ALLOW_PRIVATE_STORAGE_ENDPOINTS:-false}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [server]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 里设置 DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  caddydata:
  caddyconfig:
