name: Soak (temporary)

on:
  pull_request:

jobs:
  soak:
    name: soak ${{ matrix.arm }} ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        arm: [starts, starts-noreinstall, airplane, idle]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: bash scripts/install-maestro.sh
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 下载模拟器和系统镜像
        run: |
          yes | sdkmanager --licenses > /dev/null
          for attempt in 1 2 3; do
            sdkmanager --install emulator 'system-images;android-35;default;x86_64' --channel=0 > /dev/null && exit 0
            sleep 20
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: export PATH="$HOME/.maestro/bin:$PATH"; bash scripts/soak.sh ${{ matrix.arm }}
      - if: always()
        run: cat /tmp/adb.*.log > .artifacts/adb-server.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ matrix.arm }}-${{ matrix.rep }}
          path: |
            .artifacts/*.log
            .artifacts/maestro/maestro.log
          include-hidden-files: true
          if-no-files-found: warn
