name: 定时维护

# 清理放弃的上传和宽限期已过的文件（cli maintenance）。Docker 部署用 crontab，见 docs/DEPLOYMENT.md。
# 只由定时和手动触发，所以 PR 碰不到这些 Secret。日志不打印文件名以外的内容，命令只输出计数。
# 设置仓库变量 MAINTENANCE_ENABLED=true 才会运行。
on:
  schedule:
    # 新加坡时间每天 04:37，在备份之后。避开整点。
    - cron: "37 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance

jobs:
  maintenance:
    name: 清理文件
    if: vars.MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 清理
        env:
          # Session pooler（5432），和备份用同一条。
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          DB_SSL: require
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: auto
          S3_FORCE_PATH_STYLE: "true"
          # 要和函数的设置一致，否则宽限期不一样。
          MEDIA_TRASH_DAYS: ${{ vars.MEDIA_TRASH_DAYS || '30' }}
        run: pnpm --filter @xiaodouya/server cli maintenance
