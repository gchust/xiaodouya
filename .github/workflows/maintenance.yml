name: 定时维护

# 清理放弃的上传、宽限期已过的文件和账号删除留下的文件（cli maintenance）。Docker 部署用 crontab，见 docs/DEPLOYMENT.md。
# 只由定时和手动触发，所以 PR 碰不到这些 Secret。日志不打印文件名以外的内容，命令只输出计数。
# 设置仓库变量 MAINTENANCE_ENABLED=true 才会运行。
on:
  schedule:
    # 新加坡时间每天 04:37，在备份之后。避开整点。
    - cron: "37 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance

jobs:
  maintenance:
    name: 清理文件
    if: vars.MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # 这个任务能删生产文件，全部用 commit 固定版本，标签可以被改动。
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 清理
        env:
          # Session pooler（5432），和备份用同一条。
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          DB_SSL: require
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: auto
          S3_FORCE_PATH_STYLE: "true"
          # 要和函数的设置一致，否则宽限期不一样。
          MEDIA_TRASH_DAYS: ${{ vars.MEDIA_TRASH_DAYS || '30' }}
          # 可选，和函数里的相同。只有删除家庭自带存储里的文件时才用到，
          # 没设置时那部分留在队列里（日志写明条数），平台存储照常清理。
          APP_SECRET: ${{ secrets.APP_SECRET }}
          # 可选，和函数里的相同。有了才补发 GitHub 暂时不可用时排队的反馈；没有时它们等下一次有人提交时补发。
          # 只设一项会让这一步失败（配错拒绝启动），要么两项都设，要么都不设。
          FEEDBACK_GITHUB_REPO: ${{ secrets.FEEDBACK_GITHUB_REPO }}
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
          # 反馈附件的保留期，要和函数的设置一致。
          FEEDBACK_ATTACHMENT_DAYS: ${{ vars.FEEDBACK_ATTACHMENT_DAYS || '90' }}
          # 反馈附件的公开链接要拼服务端的地址（F-126）。没有它，同意公开附件的反馈这一步不补发，
          # 等函数自己补发。值和 App 的 EXPO_PUBLIC_API_URL 一样，没单独设就用它。
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || vars.EXPO_PUBLIC_API_URL }}
        run: pnpm --filter @xiaodouya/server cli maintenance
