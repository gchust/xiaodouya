name: Android AAB 检查

# 不用打标签也能验证 AAB：走和 release.yml 相同的 android-build.sh release，
# 但密钥是这一次运行临时生成的，产物不上传，不能用于发布。
on:
  push:
    branches: [feat/ios-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BUNDLETOOL_VERSION: "1.18.3"
      BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 释放磁盘空间
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.21.0"
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: pnpm install --frozen-lockfile
      - name: 生成临时密钥
        run: |
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.keystore" -alias throwaway \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=throwaway" \
            -storepass "$PASSWORD" -keypass "$PASSWORD"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/throwaway.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD"
            echo "ANDROID_KEY_ALIAS=throwaway"
            echo "ANDROID_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"
      - name: 构建 APK 和 AAB
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid
          GRADLE_WORKERS: "4"
          GRADLE_HEAP: 6g
        run: bash scripts/android-build.sh release --clean
      - name: 检查 AAB
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          AAB=.artifacts/xiaodouya-release.aab
          BUNDLETOOL=(java -jar "$RUNNER_TEMP/bundletool.jar")
          jarsigner -verify "$AAB"
          # PAGE_ALIGNMENT_16K 才说明 Google Play 从 AAB 生成的 APK 也按 16 KB 对齐。
          "${BUNDLETOOL[@]}" dump config --bundle="$AAB" | tee "$RUNNER_TEMP/bundle-config.json"
          grep -q PAGE_ALIGNMENT_16K "$RUNNER_TEMP/bundle-config.json"
          "${BUNDLETOOL[@]}" build-apks --bundle="$AAB" --output="$RUNNER_TEMP/out.apks" --mode=universal \
            --ks="$ANDROID_KEYSTORE_PATH" --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --ks-pass="pass:$ANDROID_KEYSTORE_PASSWORD" --key-pass="pass:$ANDROID_KEY_PASSWORD"
          unzip -o -q "$RUNNER_TEMP/out.apks" universal.apk -d "$RUNNER_TEMP"
          node scripts/check-native-libs.mjs "$RUNNER_TEMP/universal.apk"
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$AAPT2" dump badging .artifacts/xiaodouya-release.apk | grep -E "^package|targetSdkVersion|native-code"
