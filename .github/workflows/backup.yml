name: 云端数据库备份

# 公开仓库的日志和产物谁都能看：这里绝对不能上传产物、打开 set -x 或打印备份内容。
# 只由定时和手动触发，所以 PR 碰不到这些 Secret。
# 设置仓库变量 CLOUD_BACKUP_ENABLED=true 才会运行，说明见 docs/DEPLOYMENT.md。
on:
  schedule:
    # 新加坡时间每天 03:17。GitHub 高峰时可能晚点，避开整点。
    - cron: "17 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-backup

jobs:
  backup:
    name: 备份到 R2
    if: vars.CLOUD_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 这个任务碰的是全家的数据，用 commit 固定版本，标签可以被改动。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 备份
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: auto
          # pg_dump 不能比服务器旧，Runner 自带的版本可能不够新。Supabase 升级大版本时要跟着改。
          BACKUP_PG_IMAGE: postgres:17
        run: deploy/cloud-backup.sh backup
