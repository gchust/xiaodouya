# 修改尿布、没结束的睡眠、体温、吃药、洗澡。
# 测试用的记录最后都删掉。
appId: com.gchust.xiaodouya
---
- launchApp
- extendedWaitUntil:
    visible: { id: today-screen }
    timeout: 30000

# ─── 尿布：改类型 ──────────────────────────────
- scrollUntilVisible:
    element: { id: action-diaper }
    direction: UP
- tapOn: { id: action-diaper }
- tapOn: { id: diaper-poo }
- extendedWaitUntil:
    visible: 换尿布 · 便便
    timeout: 30000
- tapOn: 换尿布 · 便便
- tapOn: { id: event-edit }
- assertVisible: 修改尿布
- tapOn: { id: diaper-both }
- takeScreenshot: .artifacts/e2e-11a-diaper-edit
- tapOn: { id: diaper-save }
- extendedWaitUntil:
    notVisible: { id: diaper-save }
    timeout: 10000
- extendedWaitUntil:
    visible: 换尿布 · 尿尿 + 便便
    timeout: 15000
- assertNotVisible: 换尿布 · 便便
- tapOn: 换尿布 · 尿尿 + 便便
- tapOn: { id: event-delete }
- extendedWaitUntil:
    notVisible: 换尿布 · 尿尿 + 便便
    timeout: 15000

# ─── 没结束的睡眠：补上结束时间 ─────────────────────
- tapOn: { id: action-sleep }
- extendedWaitUntil:
    visible:
      text: 睡觉中.*
    timeout: 15000
- tapOn:
    text: 睡觉中.*
- tapOn: { id: event-edit }
- assertVisible: { id: sleep-still }
- assertNotVisible: { id: sleep-end-date }
- tapOn: { id: sleep-still }
- assertVisible: { id: sleep-end-date }
- takeScreenshot: .artifacts/e2e-11a-sleep-edit
- tapOn: { id: sleep-save }
- extendedWaitUntil:
    notVisible: { id: sleep-save }
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      text: 睡觉中.*
    timeout: 15000
- assertVisible: 睡眠
- tapOn:
    text: 睡了.*
- tapOn: { id: event-delete }
- extendedWaitUntil:
    notVisible: { id: event-delete }
    timeout: 10000

# ─── 体温：改了数值，提示要跟着变 ────────────────────
- tapOn: { id: action-more }
- tapOn: { id: more-temp }
- tapOn: { id: temp-save }
- extendedWaitUntil:
    notVisible: { id: temp-save }
    timeout: 10000
- extendedWaitUntil:
    visible: 体温 36.8℃
    timeout: 30000
- tapOn: 体温 36.8℃
- tapOn: { id: event-edit }
- assertVisible: 修改体温
- tapOn: { id: temp-inc }
- takeScreenshot: .artifacts/e2e-11a-temp-edit
- tapOn: { id: temp-save }
- extendedWaitUntil:
    notVisible: { id: temp-save }
    timeout: 10000
- extendedWaitUntil:
    visible: 体温 36.9℃
    timeout: 15000
- tapOn: 体温 36.9℃
- tapOn: { id: event-delete }
- extendedWaitUntil:
    notVisible: 体温 36.9℃
    timeout: 15000

# ─── 吃药：改剂量 ──────────────────────────────
- tapOn: { id: action-more }
- tapOn: { id: more-med }
- tapOn: { id: med-name }
- eraseText: 10
- inputText: Edit med
- hideKeyboard
- tapOn: { id: med-save }
- extendedWaitUntil:
    notVisible: { id: med-save }
    timeout: 10000
- extendedWaitUntil:
    visible: 吃药 · Edit med 1 滴
    timeout: 30000
- tapOn: 吃药 · Edit med 1 滴
- tapOn: { id: event-edit }
- assertVisible: 修改吃药
- tapOn: { id: med-dose }
- eraseText: 10
- inputText: 2 ml
- hideKeyboard
- tapOn: { id: med-save }
- extendedWaitUntil:
    notVisible: { id: med-save }
    timeout: 10000
- extendedWaitUntil:
    visible: 吃药 · Edit med 2 ml
    timeout: 15000
- tapOn: 吃药 · Edit med 2 ml
- tapOn: { id: event-delete }
- extendedWaitUntil:
    notVisible: 吃药 · Edit med 2 ml
    timeout: 15000

# ─── 洗澡：加备注 ──────────────────────────────
- tapOn: { id: action-more }
- tapOn: { id: more-bath }
- tapOn: { id: bath-save }
- extendedWaitUntil:
    notVisible: { id: bath-save }
    timeout: 10000
- extendedWaitUntil:
    visible: 洗澡
    timeout: 30000
# 流程 08 也留了一条洗澡，新的排在最前面。
- tapOn: 洗澡
- tapOn: { id: event-edit }
- assertVisible: 修改洗澡
- tapOn: { id: event-note }
- inputText: Warm bath
- hideKeyboard
- tapOn: { id: bath-save }
- extendedWaitUntil:
    notVisible: { id: bath-save }
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: Warm bath.*
    timeout: 15000
- tapOn:
    text: Warm bath.*
- tapOn: { id: event-delete }
- extendedWaitUntil:
    notVisible:
      text: Warm bath.*
    timeout: 15000
