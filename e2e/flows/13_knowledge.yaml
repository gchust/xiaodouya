- assertVisible: 这个月该知道的
# 宝宝是今天出生的，应该是 3 个月以下的那一组
- assertVisible: 吃多少算够
- takeScreenshot: .artifacts/e2e-13-knowledge
- scrollUntilVisible:
    element:
      text: 仅供参考.*
- takeScreenshot: .artifacts/e2e-13-knowledge-end
