# 点时间线的一条记录：改奶量和备注，删除时取消，删除后撤销，再删除并确认重启后不会回来。
# 行的 testID 带随机 id，只能按文字选。文字是整串匹配，不会选到喂奶卡片和 Toast。
appId: com.gchust.xiaodouya
---
- launchApp
- extendedWaitUntil:
    visible: { id: today-screen }
    timeout: 30000
- tapOn: { id: action-feed }
- tapOn: { id: ml-chip-100 }
- tapOn: { id: ml-inc }
- assertVisible: "110"
- tapOn: { id: feed-save }
- extendedWaitUntil:
    notVisible: { id: feed-save }
    timeout: 10000
# 时间线要等“今天”页的时钟走到记录之后才显示，最多 15 秒。
- extendedWaitUntil:
    visible: 喂奶 110ml
    timeout: 30000
# 修改
- tapOn: 喂奶 110ml
- takeScreenshot: .artifacts/e2e-11-event-actions
- tapOn: { id: event-edit }
- assertVisible: 修改喂奶
- tapOn: { id: ml-inc }
- tapOn: { id: ml-inc }
- tapOn: { id: ml-inc }
- assertVisible: "140"
- tapOn: { id: feed-note }
- inputText: Spit up
- hideKeyboard
- takeScreenshot: .artifacts/e2e-11-edit-sheet
- tapOn: { id: feed-save }
- extendedWaitUntil:
    notVisible: { id: feed-save }
    timeout: 10000
- extendedWaitUntil:
    visible: 喂奶 140ml
    timeout: 15000
- assertNotVisible: 喂奶 110ml
- assertVisible:
    text: Spit up.*
- takeScreenshot: .artifacts/e2e-11-after-edit
# 删除要确认（issue #78）：点了删除先弹确认，取消后记录还在。
- tapOn: 喂奶 140ml
- tapOn: { id: event-delete }
- assertVisible: 删除这条喂奶记录？
- assertVisible: { id: delete-sheet-body }
- takeScreenshot: .artifacts/e2e-11-delete-confirm
- tapOn: { id: delete-sheet-cancel }
- extendedWaitUntil:
    notVisible: { id: delete-sheet-cancel }
    timeout: 10000
- assertVisible: 喂奶 140ml
# 删除后撤销。确认之后 Toast 只有几秒，确认和撤销之间不能插别的步骤。
- tapOn: 喂奶 140ml
- tapOn: { id: event-delete }
- tapOn: { id: delete-sheet-confirm }
- tapOn: { id: toast-undo }
# 弹层的标题和这一行文字相同，先等弹层收起，下面的断言才说明记录真的回来了。
- extendedWaitUntil:
    notVisible: { id: event-delete }
    timeout: 10000
- extendedWaitUntil:
    visible: 喂奶 140ml
    timeout: 15000
- takeScreenshot: .artifacts/e2e-11-after-undo
# 删除，不撤销
- tapOn: 喂奶 140ml
- tapOn: { id: event-delete }
- tapOn: { id: delete-sheet-confirm }
- extendedWaitUntil:
    notVisible: 喂奶 140ml
    timeout: 15000
- takeScreenshot: .artifacts/e2e-11-after-delete
- launchApp
- extendedWaitUntil:
    visible: { id: today-screen }
    timeout: 30000
- assertVisible: { id: today-title }
- assertNotVisible: 喂奶 140ml
