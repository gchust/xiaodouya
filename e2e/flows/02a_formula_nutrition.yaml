# 奶粉营养：没标注时不安慰；手动配置、沿用上一次、预置只有名字、按部分字段估算。
# 不依赖 02：ls 的排序跟语言环境有关，这个流程可能排在 02 前面。
appId: com.gchust.xiaodouya
---
- launchApp
- extendedWaitUntil:
    visible: { id: today-screen }
    timeout: 30000
# 默认收起，记喂奶不多一步
- tapOn: { id: action-feed }
- assertVisible: 奶类型（可选）
- assertNotVisible: { id: milk-formula }
- tapOn: { id: ml-chip-90 }
- tapOn: { id: feed-save }
- extendedWaitUntil:
    notVisible: { id: feed-save }
    timeout: 10000
- extendedWaitUntil:
    visible: 喂奶 90ml
    timeout: 30000
# Toast 可能盖住入口
- extendedWaitUntil:
    notVisible: { id: toast-undo }
    timeout: 15000
# 没标注：只说数据不足和原因
- scrollUntilVisible:
    element: { id: nutrition-entry }
- assertVisible:
    text: .*数据不足 · 有 .* 次喂奶没算进去.*
- takeScreenshot: .artifacts/e2e-02a-today-entry
- tapOn: { id: nutrition-entry }
- extendedWaitUntil:
    visible: { id: nutrition-screen }
    timeout: 10000
- assertVisible:
    text: 有 .* 次喂奶没有标注奶类型，没算进去
- takeScreenshot: .artifacts/e2e-02a-insufficient
- scrollUntilVisible:
    element: { id: nutrient-calciumMg-status }
- assertVisible:
    id: nutrient-calciumMg-status
    text: 数据不足
- assertNotVisible: 达到参考量
- scrollUntilVisible:
    element: { id: nutrition-disclaimer }
- assertVisible: 估算，不能替代医生建议。早产或有特殊情况的宝宝，请听医生的。
- takeScreenshot: .artifacts/e2e-02a-notes
# 预置只有名字：不带数值，提示对照罐身
- scrollUntilVisible:
    element: { id: nutrition-add-formula }
- tapOn: { id: nutrition-add-formula }
- takeScreenshot: .artifacts/e2e-02a-presets
- scrollUntilVisible:
    element: { id: formula-preset-biostime-paixing-1 }
- tapOn: { id: formula-preset-biostime-paixing-1 }
- assertVisible: { id: formula-name-only }
- takeScreenshot: .artifacts/e2e-02a-preset-name-only
- scrollUntilVisible:
    element: { id: formula-save }
- tapOn: { id: formula-save }
- extendedWaitUntil:
    notVisible: { id: formula-save }
    timeout: 10000
- scrollUntilVisible:
    element: { text: 还没有营养数据，请对照罐身录入 }
- assertVisible: 合生元 派星 1 段
- takeScreenshot: .artifacts/e2e-02a-name-only-listed
- scrollUntilVisible:
    element: { id: nutrition-back }
    direction: UP
- tapOn: { id: nutrition-back }
- extendedWaitUntil:
    visible: { id: today-screen }
    timeout: 10000
- scrollUntilVisible:
    element: { id: action-feed }
    direction: UP
# 记喂奶时手动配置一款：只填部分字段，填完回到喂奶弹层，奶量还在
- tapOn: { id: action-feed }
- tapOn: { id: ml-chip-120 }
- tapOn: { id: feed-milk-toggle }
- tapOn: { id: milk-formula }
- takeScreenshot: .artifacts/e2e-02a-milk-open
- tapOn: { id: formula-add }
- tapOn: { id: formula-manual }
- tapOn: { id: formula-name }
- inputText: TestFormula
- hideKeyboard
- tapOn: { id: formula-field-proteinG }
- inputText: "1.4"
- hideKeyboard
- tapOn: { id: formula-field-calciumMg }
- inputText: "50"
- hideKeyboard
- takeScreenshot: .artifacts/e2e-02a-editor
- scrollUntilVisible:
    element: { id: formula-save }
- tapOn: { id: formula-save }
- extendedWaitUntil:
    visible: { id: feed-save }
    timeout: 10000
- assertVisible: 奶粉 · TestFormula
- assertVisible: "120"
- takeScreenshot: .artifacts/e2e-02a-feed-with-formula
- tapOn: { id: feed-save }
- extendedWaitUntil:
    notVisible: { id: feed-save }
    timeout: 10000
- extendedWaitUntil:
    visible: 喂奶 120ml
    timeout: 30000
- extendedWaitUntil:
    notVisible: { id: toast-undo }
    timeout: 15000
# 下一次沿用：不用再选，直接记
- tapOn: { id: action-feed }
- assertVisible: 奶粉 · TestFormula
- assertVisible: "120"
- takeScreenshot: .artifacts/e2e-02a-next-feed-default
- tapOn: { id: sheet-cancel }
# 把这个流程和 02 留下的没标注的喂奶都标上，才能看到“目前已摄入”
- tapOn: 喂奶 90ml
- tapOn: { id: event-edit }
- tapOn: { id: feed-milk-toggle }
- tapOn: { id: milk-formula }
- tapOn: { id: "formula-choice-TestFormula" }
- tapOn: { id: feed-save }
- extendedWaitUntil:
    notVisible: { id: feed-save }
    timeout: 10000
- scrollUntilVisible:
    element: { text: 喂奶 130ml }
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: 喂奶 130ml
    commands:
      - tapOn: 喂奶 130ml
      - tapOn: { id: event-edit }
      - tapOn: { id: feed-milk-toggle }
      - tapOn: { id: milk-formula }
      - tapOn: { id: "formula-choice-TestFormula" }
      - tapOn: { id: feed-save }
      - extendedWaitUntil:
          notVisible: { id: feed-save }
          timeout: 10000
- extendedWaitUntil:
    notVisible:
      text: 已记录.*
    timeout: 15000
- scrollUntilVisible:
    element: { id: nutrition-entry }
- assertVisible:
    text: .*目前已摄入.*
- tapOn: { id: nutrition-entry }
- extendedWaitUntil:
    visible: { id: nutrition-screen }
    timeout: 10000
# 填了的说进度，没填的说数据不足，不当 0，也不下结论
- scrollUntilVisible:
    element: { id: nutrient-calciumMg-status }
- assertVisible:
    id: nutrient-calciumMg-status
    text: 目前已摄入 .*%
- scrollUntilVisible:
    element: { id: nutrient-ironMg-status }
- assertVisible:
    id: nutrient-ironMg-status
    text: 数据不足
- assertVisible: — / 参考 0.27 mg
- assertNotVisible: 达到参考量
- assertNotVisible: 低于参考量
- takeScreenshot: .artifacts/e2e-02a-progress
# 能修改
- scrollUntilVisible:
    element: { id: formula-row-TestFormula }
- takeScreenshot: .artifacts/e2e-02a-formula-list
- tapOn: { id: formula-row-TestFormula }
- assertVisible: 修改奶粉
- tapOn: { id: formula-field-ironMg }
- inputText: "1"
- hideKeyboard
- takeScreenshot: .artifacts/e2e-02a-edit-formula
- scrollUntilVisible:
    element: { id: formula-save }
- tapOn: { id: formula-save }
- extendedWaitUntil:
    notVisible: { id: formula-save }
    timeout: 10000
- scrollUntilVisible:
    element: { id: nutrition-back }
    direction: UP
- tapOn: { id: nutrition-back }
- extendedWaitUntil:
    visible: { id: today-screen }
    timeout: 10000
- scrollUntilVisible:
    element: { id: action-feed }
    direction: UP
