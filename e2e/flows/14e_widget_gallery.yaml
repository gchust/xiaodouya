# App 里的“桌面小工具”页：从家人页进来，五个小工具都有预览和“添加到桌面”，点了以后系统弹出添加窗口，
# 关掉还在这一页。桌面不支持直接添加时会有提示，这一页底下也一直写着手动添加的路径。
# 小工具本身是系统画在桌面上的，Maestro 看不到，见 docs/PROGRESS.md F-115。
appId: com.gchust.xiaodouya
---
- launchApp
- extendedWaitUntil:
    visible: { id: tab-family }
    timeout: 30000
- tapOn: { id: tab-family }
- scrollUntilVisible:
    element: { id: open-widgets }
- tapOn: { id: open-widgets }
- extendedWaitUntil:
    visible: { id: widgets-screen }
    timeout: 10000
# 小工具上的称呼和头像（F-129）：存在这台手机上，离开再回来还在。头像默认关着。
- assertVisible: { id: widget-display }
- assertVisible: { id: widget-avatar-toggle, checked: false }
- tapOn: { id: widget-label-input }
- inputText: Bean
- hideKeyboard
- tapOn: { id: widget-avatar-toggle }
- assertVisible: { id: widget-avatar-toggle, checked: true }
# 这一组的宝宝没有头像：打开了也只能提示去今天页加。
- assertVisible: { id: widget-avatar-missing }
- takeScreenshot: .artifacts/e2e-14e-widget-display
- tapOn: { id: widgets-back }
- extendedWaitUntil:
    visible: { id: open-widgets }
    timeout: 10000
- tapOn: { id: open-widgets }
- extendedWaitUntil:
    visible: { id: widgets-screen }
    timeout: 10000
- assertVisible: { id: widget-label-input, text: Bean }
- assertVisible: { id: widget-avatar-toggle, checked: true }
# 清空称呼就回到宝宝的名字，关掉头像，后面的流程照旧。
- tapOn: { id: widget-label-input }
- eraseText: 10
- hideKeyboard
- tapOn: { id: widget-avatar-toggle }
- assertVisible: { id: widget-avatar-toggle, checked: false }
- assertNotVisible: { id: widget-avatar-missing }
- assertVisible: { id: widget-card-QuickWidget }
- assertVisible: { id: widget-card-FeedWidget }
- assertVisible: { id: widget-card-SleepWidget }
- takeScreenshot: .artifacts/e2e-14e-widget-gallery
- scrollUntilVisible:
    element: { id: widgets-manual-hint }
- assertVisible: { id: widget-card-DiaperWidget }
- assertVisible: { id: widget-card-SummaryWidget }
- takeScreenshot: .artifacts/e2e-14e-widget-gallery-bottom
- tapOn: { id: widget-pin-DiaperWidget }
- takeScreenshot: .artifacts/e2e-14e-pin-request
# 系统的添加窗口盖在上面时这一页看不到，按返回关掉它；桌面不支持时没有窗口，只有提示。
- runFlow:
    when:
      notVisible: { id: widgets-screen }
    commands:
      - pressKey: back
- extendedWaitUntil:
    visible: { id: widgets-screen }
    timeout: 10000
- scrollUntilVisible:
    element: { id: widgets-back }
    direction: UP
- tapOn: { id: widgets-back }
- extendedWaitUntil:
    visible: { id: open-widgets }
    timeout: 10000
