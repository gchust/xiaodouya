# iOS 用 Quick Look 打开证件 PDF：要从 S3 下载回来，文件名要带 .pdf，系统才认得。依赖流程 04。
appId: com.gchust.xiaodouya
---
- launchApp
- extendedWaitUntil:
    visible: { id: tab-info }
    timeout: 30000
- tapOn: { id: tab-info }
- scrollUntilVisible:
    element: { id: doc-card-护照 }
- tapOn: { id: doc-card-护照 }
- extendedWaitUntil:
    visible: { id: document-screen }
    timeout: 10000
- tapOn: { id: doc-file-sample-certificate.pdf }
# Quick Look 是系统界面，这些 id 由 iOS 决定。关闭按钮在 iOS 26 上只有一个 ×，没有文字。
- extendedWaitUntil:
    visible: { id: QLOverlayDoneButtonAccessibilityIdentifier }
    timeout: 30000
- assertVisible: { id: QLPDFViewControllerViewAccessibilityIdentifier }
- takeScreenshot: .artifacts/e2e-ios-pdf-preview
- tapOn: { id: QLOverlayDoneButtonAccessibilityIdentifier }
- extendedWaitUntil:
    visible: { id: document-screen }
    timeout: 10000
- tapOn: { id: doc-back }
